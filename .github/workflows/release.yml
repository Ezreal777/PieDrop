name: Release

# 推送 v* tag 时自动构建 universal DMG 并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build universal app & DMG
        run: PIEDROP_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh --release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/PieDrop-*.dmg --generate-notes --title "PieDrop $GITHUB_REF_NAME"
